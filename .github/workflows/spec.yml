name: Protocol spec

on:
  pull_request:
    paths: ["spec/**"]
  push:
    branches: [main, dev]
    paths: ["spec/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the spec
        run: ruby spec/tools/check.rb
