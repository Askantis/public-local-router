[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0 OR PolyForm-Small-Business-1.0.0"
repository = "https://github.com/Askantis/public-local-router"
rust-version = "1.89"

[workspace.dependencies]
localrouter-hf = { path = "crates/localrouter-hf" }
localrouter-audio = { path = "crates/localrouter-audio" }
localrouter-speech = { path = "crates/localrouter-speech" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ureq = "3.5"
tempfile = "3"
symphonia = { version = "0.6.1", features = ["all"] }
rubato = "=5.0.1"
whisper-rs = { version = "0.16.0", features = ["metal"] }
speakrs = { version = "0.7.0", default-features = false, features = ["coreml", "cpu"] }
nnnoiseless = "0.5.2"
clap = { version = "4", features = ["derive"] }

[profile.release]
debug = 1

[patch.crates-io]
whisper-rs-sys = { path = "third_party/whisper-rs-sys" }
